<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<title>Hydraulic Pressure Calculator – Report</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#eef2fa;font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif;color:#14213d}
.page{max-width:760px;margin:0 auto;background:#fff;min-height:100vh}
header{background:#0b3d91;color:#fff;padding:18px 20px}
header h1{margin:0;font-size:18px}header p{margin:4px 0 0;font-size:13px;opacity:.85}
section{padding:14px 20px 4px}
h2{margin:0 0 8px;font-size:13px;letter-spacing:.04em;color:#0b3d91;border-bottom:2px solid #0b3d91;padding-bottom:4px}
.row{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-bottom:1px solid #e3e9f5;font-size:14px}
.row span:first-child{color:#5b6b8c}.row span:last-child{font-weight:600;text-align:right;word-break:break-word}
.big{background:#e8f0ff;border-radius:10px;text-align:center;padding:16px;margin:4px 0 8px;font-size:34px;font-weight:700;color:#0b3d91}
.note{font-size:11px;color:#5b6b8c;padding:12px 20px}
.ok{color:#0a7a3b;font-weight:700}.err{padding:40px 20px;text-align:center}.err h1{color:#b3261e}
.btns{padding:14px 20px;display:flex;gap:10px}
button{flex:1;padding:13px;border:0;border-radius:10px;background:#0b3d91;color:#fff;font-size:15px;font-weight:600}
@media print{.btns{display:none}body{background:#fff}}
</style>
</head>
<body>
<div class="page" id="app"></div>
<script>
const L={tr:{title:"Hesaplama Raporu",id:"Rapor Kimliği",name:"Rapor Adı",type:"Hesaplama Türü",cas:"Kaset",cyl:"Silindir",batch:"Toplu Rapor",
info:"RAPOR BİLGİLERİ",press:"HESAPLANAN BASINÇ",inp:"GİRİŞ PARAMETRELERİ",model:"Model Bilgisi",date:"Hesaplama Tarihi",created:"Rapor Oluşturma",
mb:"Max BAR (Silindir)",ins:"Instruction (Tork Talimatı)",kn:"Max kN·Nm (Ekipman)",casH:"KASET VE LOKMA BİLGİLERİ",cylH:"SİLİNDİR BİLGİLERİ",casT:"Kaset Tipi",cylT:"Silindir Tipi",
af:"Lokma Ölçüsü (A/F)",met:"Silindir Boyutu (Metrik)",tech:"TEKNİSYEN BİLGİLERİ",by:"Hesaplamayı Yapan",verified:"Doğrulama kodu geçerli",ck:"Doğrulama Kodu",
count:"Kayıt Sayısı",pdf:"PDF olarak indir / yazdır",errT:"Rapor açılamadı",errB:"Bu bağlantı geçerli bir rapor içermiyor, eksik veya bozulmuş. Lütfen QR kodu yeniden okutun.",
note:"Bu rapor bilgilendirme amaçlıdır. Resmi onaylı veya sertifikalı bir mühendislik belgesi değildir. Rapor verisi QR bağlantısının içindedir; sunucuda saklanmaz."},
en:{title:"Calculation Report",id:"Report ID",name:"Report Name",type:"Calculation Type",cas:"Cassette",cyl:"Cylinder",batch:"Batch Report",
info:"REPORT INFORMATION",press:"CALCULATED PRESSURE",inp:"INPUT PARAMETERS",model:"Model",date:"Calculation Date",created:"Report Created",
mb:"Max BAR (Cylinder)",ins:"Instruction (Torque)",kn:"Max kN·Nm (Equipment)",casH:"CASSETTE & SOCKET INFORMATION",cylH:"CYLINDER INFORMATION",casT:"Cassette Type",cylT:"Cylinder Type",
af:"Socket Size (A/F)",met:"Cylinder Size (Metric)",tech:"TECHNICIAN INFORMATION",by:"Calculated by",verified:"Verification code valid",ck:"Verification Code",
count:"Number of Records",pdf:"Download / print as PDF",errT:"Report cannot be opened",errB:"This link does not contain a valid report; it is incomplete or damaged. Please scan the QR code again.",
note:"This report is informational only and is not an officially approved or certified engineering document. The data is carried inside the QR link and is not stored on a server."},
de:{title:"Berechnungsbericht",id:"Berichts-ID",name:"Berichtsname",type:"Berechnungstyp",cas:"Kassette",cyl:"Zylinder",batch:"Sammelbericht",
info:"BERICHTSINFORMATIONEN",press:"BERECHNETER DRUCK",inp:"EINGABEPARAMETER",model:"Modell",date:"Berechnungsdatum",created:"Bericht erstellt",
mb:"Max BAR (Zylinder)",ins:"Instruction (Drehmoment)",kn:"Max kN·Nm (Ausrüstung)",casH:"KASSETTEN- UND NUSSINFORMATIONEN",cylH:"ZYLINDERINFORMATIONEN",casT:"Kassettentyp",cylT:"Zylindertyp",
af:"Nussgröße (A/F)",met:"Zylindergröße (metrisch)",tech:"TECHNIKERINFORMATIONEN",by:"Berechnet von",verified:"Prüfcode gültig",ck:"Prüfcode",
count:"Anzahl Einträge",pdf:"Als PDF speichern / drucken",errT:"Bericht kann nicht geöffnet werden",errB:"Dieser Link enthält keinen gültigen Bericht; er ist unvollständig oder beschädigt. Bitte QR-Code erneut scannen.",
note:"Dieser Bericht dient nur der Information und ist kein amtlich genehmigtes oder zertifiziertes Dokument. Die Daten stehen im QR-Link und werden nicht auf einem Server gespeichert."}};
const lg=(navigator.language||"tr").slice(0,2);const T=L[lg]||L.en;
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt=s=>{if(!s||s.length<14)return s||"";return s.slice(6,8)+"."+s.slice(4,6)+"."+s.slice(0,4)+" "+s.slice(8,10)+":"+s.slice(10,12)+":"+s.slice(12,14)};
const num=s=>{const n=Number(s);return isFinite(n)?String(n):s};
function row(k,v){return v?`<div class="row"><span>${esc(k)}</span><span>${esc(v)}</span></div>`:""}
function fail(){document.getElementById("app").innerHTML=`<header><h1>Hydraulic Pressure Calculator</h1></header><div class="err"><h1>${T.errT}</h1><p>${T.errB}</p></div>`}
async function sha(s){const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(s));return Array.from(new Uint8Array(b).slice(0,4)).map(x=>x.toString(16).padStart(2,"0")).join("").toUpperCase()}
async function main(){
 try{
  let h=location.hash.slice(1);if(!h)return fail();
  h=h.replace(/-/g,"+").replace(/_/g,"/");while(h.length%4)h+="=";
  const bin=atob(h);const txt=new TextDecoder().decode(Uint8Array.from(bin,c=>c.charCodeAt(0)));
  const i=txt.lastIndexOf("|CK=");
  if(!txt.startsWith("HPC1|")||i<0)return fail();
  const ck=txt.slice(i+4).trim();
  if((await sha(txt.slice(0,i)))!==ck.toUpperCase())return fail();
  const f={};txt.slice(5,i).split("|").forEach(p=>{const e=p.indexOf("=");if(e>0)f[p.slice(0,e)]=p.slice(e+1)});
  if(!f.ID)return fail();
  const batch="N" in f,cas=f.T==="CASSETTE";
  let b=`<header><h1>Hydraulic Pressure Calculator</h1><p>${T.title} · ${esc(f.ID.slice(0,8))}</p></header>`;
  b+=`<section><h2>${T.info}</h2>`+row(T.id,f.ID)+row(T.name,f.RN)+(batch?row(T.type,T.batch)+row(T.count,f.N):(f.T?row(T.type,cas?T.cas:T.cyl):""))+row(T.created,fmt(f.CT))+(f.CALC?row(T.date,fmt(f.CALC)):"")+row(T.model,f.M)+`</section>`;
  if(!batch){
   b+=`<section><h2>${T.press}</h2><div class="big">${esc(f.BAR||"")} BAR</div></section>`;
   if(f.MB||f.IN||f.KN)b+=`<section><h2>${T.inp}</h2>`+(f.MB?row(T.mb,num(f.MB)+" BAR"):"")+(f.IN?row(T.ins,num(f.IN)+" kN·Nm"):"")+(f.KN?row(T.kn,num(f.KN)+" kN·Nm"):"")+`</section>`;
   if(f.T&&f.S)b+=`<section><h2>${cas?T.casH:T.cylH}</h2>`+row(cas?T.casT:T.cylT,f.ET)+row(cas?T.af:T.met,f.S)+`</section>`;
   if(f.TN)b+=`<section><h2>${T.tech}</h2>`+row(T.by,f.TN+(f.TI?" ("+f.TI+")":""))+`</section>`;
  }
  b+=`<section><h2>${T.ck}</h2>`+row(T.ck,ck)+`<div class="row"><span></span><span class="ok">✔ ${T.verified}</span></div></section>`;
  b+=`<div class="btns"><button onclick="window.print()">${T.pdf}</button></div><div class="note">${T.note}</div>`;
  document.getElementById("app").innerHTML=b;document.title="HPC "+f.ID.slice(0,8);
 }catch(e){fail()}
}
main();
</script>
</body>
</html>
