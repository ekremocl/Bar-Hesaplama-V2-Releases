<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">

<title>Hydraulic Pressure Calculator – Report</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#eef2fa;font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif;color:#14213d}
.page{max-width:760px;margin:0 auto;background:#fff;min-height:100vh;padding-bottom:20px}
header{background:#0b3d91;color:#fff;padding:18px 20px}
header h1{margin:0;font-size:18px}header p{margin:4px 0 0;font-size:13px;opacity:.85;word-break:break-all}
section{padding:12px 16px 2px}
h2{margin:0 0 8px;font-size:13px;letter-spacing:.04em;color:#0b3d91;border-bottom:2px solid #0b3d91;padding-bottom:4px}
.row{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-bottom:1px solid #e3e9f5;font-size:14px}
.row span:first-child{color:#5b6b8c}.row span:last-child{font-weight:600;text-align:right;word-break:break-word}
.big{background:#e8f0ff;border-radius:10px;text-align:center;padding:12px;margin:4px 0 8px;font-size:28px;font-weight:700;color:#0b3d91}
.note{font-size:11px;color:#5b6b8c;padding:12px 20px}
.ok{color:#0a7a3b;font-weight:700}.err{padding:40px 20px;text-align:center}.err h1{color:#b3261e}
.all{padding:14px 16px 4px}
button{width:100%;padding:14px;border:0;border-radius:10px;background:#0b3d91;color:#fff;font-size:15px;font-weight:700}
button.sec{background:#e8f0ff;color:#0b3d91;margin-top:8px;padding:11px;font-size:14px}
button:disabled{opacity:.6}
.bar{height:10px;border-radius:5px;background:#dfe7f6;margin-top:10px;overflow:hidden;display:none}
.bar i{display:block;height:100%;width:0;background:#0b3d91;transition:width .15s}
.pt{font-size:12px;color:#5b6b8c;margin-top:6px;min-height:16px}
details{margin:10px 16px;border:1px solid #d5def0;border-radius:12px;overflow:hidden}
summary{list-style:none;cursor:pointer;padding:12px 14px;background:#f4f7fd;display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:14px}
summary::-webkit-details-marker{display:none}
summary b{color:#0b3d91;font-size:16px;white-space:nowrap}
summary small{display:block;color:#5b6b8c;font-size:12px;margin-top:2px}
.in{padding:0 4px 12px}
</style>
</head>
<body>
<div class="page" id="app"></div>
<script src="qrcode.js"></script>
<script>
const L={tr:{title:"Hesaplama Raporu",id:"Rapor Kimliği",share:"Paylaşım Kimliği",name:"Rapor Adı",type:"Hesaplama Türü",cas:"Kaset",cyl:"Silindir",

mb:"Max BAR (Silindir)",ins:"Instruction (Tork Talimatı)",kn:"Max kN·Nm (Ekipman)",casH:"KASET VE LOKMA BİLGİLERİ",cylH:"SİLİNDİR BİLGİLERİ",casT:"Kaset Tipi",cylT:"Silindir Tipi",
af:"Lokma Ölçüsü (A/F)",met:"Silindir Boyutu (Metrik)",tech:"TEKNİSYEN BİLGİLERİ",by:"Hesaplamayı Yapan",verified:"Doğrulama kodu geçerli",ck:"Doğrulama Kodu",
count:"hesaplama paylaşıldı",all:"Tüm Hesaplamaları PDF Olarak İndir",one:"Bu hesaplamayı PDF indir",prog:"PDF hazırlanıyor",done:"Tamamlandı – ZIP indirildi",
errT:"Rapor açılamadı",errB:"Bu bağlantı geçerli bir rapor içermiyor, eksik veya bozulmuş. Lütfen QR kodu yeniden okutun.",

fn:"Rapor",pdfT:"Hesaplama Raporu"},
en:{title:"Calculation Report",id:"Report ID",share:"Share ID",name:"Report Name",type:"Calculation Type",cas:"Cassette",cyl:"Cylinder",
info:"REPORT INFORMATION",press:"CALCULATED PRESSURE",inp:"INPUT PARAMETERS",model:"Model",date:"Calculation Date",created:"Shared On",
mb:"Max BAR (Cylinder)",ins:"Instruction (Torque)",kn:"Max kN·Nm (Equipment)",casH:"CASSETTE & SOCKET INFORMATION",cylH:"CYLINDER INFORMATION",casT:"Cassette Type",cylT:"Cylinder Type",
af:"Socket Size (A/F)",met:"Cylinder Size (Metric)",tech:"TECHNICIAN INFORMATION",by:"Calculated by",verified:"Verification code valid",ck:"Verification Code",
count:"calculations shared",all:"Download All Calculations as PDF",one:"Download this calculation as PDF",prog:"Preparing PDFs",done:"Done – ZIP downloaded",

de:{title:"Berechnungsbericht",id:"Berichts-ID",share:"Freigabe-ID",name:"Berichtsname",type:"Berechnungstyp",cas:"Kassette",cyl:"Zylinder",

mb:"Max BAR (Zylinder)",ins:"Instruction (Drehmoment)",kn:"Max kN·Nm (Ausrüstung)",casH:"KASSETTEN- UND NUSSINFORMATIONEN",cylH:"ZYLINDERINFORMATIONEN",casT:"Kassettentyp",cylT:"Zylindertyp",
af:"Nussgröße (A/F)",met:"Zylindergröße (metrisch)",tech:"TECHNIKERINFORMATIONEN",by:"Berechnet von",verified:"Prüfcode gültig",ck:"Prüfcode",
count:"Berechnungen geteilt",all:"Alle Berechnungen als PDF herunterladen",one:"Diese Berechnung als PDF laden",prog:"PDFs werden erstellt",done:"Fertig – ZIP heruntergeladen",
errT:"Bericht kann nicht geöffnet werden",errB:"Dieser Link enthält keinen gültigen Bericht; er ist unvollständig oder beschädigt. Bitte QR-Code erneut scannen.",
old:"Ihr Browser ist zu alt für diesen Link. Bitte aktualisieren.",skipped:"beschädigter Eintrag übersprungen",
note:"Dieser Bericht dient nur der Information und ist kein amtlich genehmigtes oder zertifiziertes Dokument. Die Daten stehen im QR-Link und werden nicht auf einem Server gespeichert.",
fn:"Bericht",pdfT:"Berechnungsbericht"}};
const lg=(navigator.language||"tr").slice(0,2);const T=L[lg]||L.en;
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt=s=>{if(!s||s.length<14)return s||"";return s.slice(6,8)+"."+s.slice(4,6)+"."+s.slice(0,4)+" "+s.slice(8,10)+":"+s.slice(10,12)+":"+s.slice(12,14)};
const num=s=>{const n=Number(s);return isFinite(n)?String(n):s};
const row=(k,v)=>v?`<div class="row"><span>${esc(k)}</span><span>${esc(v)}</span></div>`:"";
const $=id=>document.getElementById(id);
let SID="",CREATED="",ENTRIES=[];

async function sha(s){const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(s));return Array.from(new Uint8Array(b).slice(0,4)).map(x=>x.toString(16).padStart(2,"0")).join("").toUpperCase()}
function b64u(h){h=h.replace(/-/g,"+").replace(/_/g,"/");while(h.length%4)h+="=";return Uint8Array.from(atob(h),c=>c.charCodeAt(0))}
async function inflate(bytes){const ds=new DecompressionStream("deflate-raw");const w=ds.writable.getWriter();w.write(bytes);w.close();return new Uint8Array(await new Response(ds.readable).arrayBuffer())}
async function parseLine(line){
  const i=line.lastIndexOf("|CK=");if(i<0)return null;
  if((await sha(line.slice(0,i)))!==line.slice(i+4).trim().toUpperCase())return null;
  const f={};line.slice(line.indexOf("|")+1,i).split("|").forEach(p=>{const e=p.indexOf("=");if(e>0)f[p.slice(0,e)]=p.slice(e+1)});
  f._ck=line.slice(i+4).trim();return f}
async function load(){
  let h=location.hash.slice(1);if(!h)throw 0;
  let lines;
  if(h.startsWith("g1.")){
    if(typeof DecompressionStream==="undefined")throw "old";
    lines=new TextDecoder().decode(await inflate(b64u(h.slice(3)))).split("\n").filter(Boolean);
  }else lines=[new TextDecoder().decode(b64u(h))];
  let skipped=0;
  if(lines[0].startsWith("HPCS|")){
    const hd=await parseLine(lines[0]);if(!hd||!hd.SID)throw 0;
    SID=hd.SID;CREATED=hd.CT||"";lines=lines.slice(1);
  }
  for(const ln of lines){const f=ln.startsWith("HPC1|")?await parseLine(ln):null;if(f&&f.ID)ENTRIES.push(f);else skipped++}
  if(!ENTRIES.length)throw 0;
  if(!SID){SID=ENTRIES[0].ID.slice(0,8);CREATED=ENTRIES[0].CT||""}
  return skipped}

function sections(f){
  const cas=f.T==="CASSETTE";let b="";
  b+=`<section><h2>${T.info}</h2>`+row(T.id,f.ID)+row(T.name,f.RN)+(f.T?row(T.type,cas?T.cas:T.cyl):"")+(f.CALC?row(T.date,fmt(f.CALC)):"")+row(T.model,f.M)+`</section>`;
  b+=`<section><h2>${T.press}</h2><div class="big">${esc(f.BAR||"")} BAR</div></section>`;
  if(f.MB||f.IN||f.KN)b+=`<section><h2>${T.inp}</h2>`+(f.MB?row(T.mb,num(f.MB)+" BAR"):"")+(f.IN?row(T.ins,num(f.IN)+" kN·Nm"):"")+(f.KN?row(T.kn,num(f.KN)+" kN·Nm"):"")+`</section>`;
  if(f.T&&f.S)b+=`<section><h2>${cas?T.casH:T.cylH}</h2>`+row(cas?T.casT:T.cylT,f.ET)+row(cas?T.af:T.met,f.S)+`</section>`;
  if(f.TN)b+=`<section><h2>${T.tech}</h2>`+row(T.by,f.TN+(f.TI?" ("+f.TI+")":""))+`</section>`;
  b+=`<section><h2>${T.ck}</h2>`+row(T.ck,f._ck)+`<div class="row"><span></span><span class="ok">✔ ${T.verified}</span></div></section>`;
  return b}

function render(skipped){
  let b=`<header><h1>Hydraulic Pressure Calculator</h1><p>${T.share}: ${esc(SID)}<br>${ENTRIES.length} ${T.count}${skipped?" · "+skipped+" "+T.skipped:""}</p></header>`;
  b+=`<div class="all"><button id="allBtn">${T.all}</button><div class="bar" id="bar"><i id="barI"></i></div><div class="pt" id="pt"></div></div>`;
  ENTRIES.forEach((f,i)=>{
    const cas=f.T==="CASSETTE";
    b+=`<details${ENTRIES.length===1?" open":""}><summary><span>#${i+1} · ${f.T?(cas?T.cas:T.cyl):""}${f.S?" · "+esc(f.S):""}<small>${esc(fmt(f.CALC||f.CT))}</small></span><b>${esc(f.BAR||"")} BAR</b></summary><div class="in">${sections(f)}<div class="all"><button class="sec" data-i="${i}">${T.one}</button></div></div></details>`});
  b+=`<div class="note">${T.note}</div>`;
  $("app").innerHTML=b;document.title="HPC "+SID;
  $("allBtn").onclick=downloadAll;
  document.querySelectorAll("button.sec").forEach(x=>x.onclick=()=>downloadOne(+x.dataset.i,x))}
function fail(m){$("app").innerHTML=`<header><h1>Hydraulic Pressure Calculator</h1></header><div class="err"><h1>${T.errT}</h1><p>${m==="old"?T.old:T.errB}</p></div>`}

/* ---------- PDF (one A4 page per calculation) ---------- */
const PW=595,PH=842,SC=2.2;
function fit(ctx,text,maxW,size,bold){let s=size;ctx.font=(bold?"bold ":"")+s+"px Arial,Helvetica,sans-serif";while(ctx.measureText(text).width>maxW&&s>7){s-=.5;ctx.font=(bold?"bold ":"")+s+"px Arial,Helvetica,sans-serif"}
  if(ctx.measureText(text).width>maxW){while(text.length>1&&ctx.measureText(text+"…").width>maxW)text=text.slice(0,-1);text+="…"}return text}
function pageCanvas(f,idx,total){
  const cv=document.createElement("canvas");cv.width=Math.round(PW*SC);cv.height=Math.round(PH*SC);
  const c=cv.getContext("2d");c.scale(SC,SC);c.fillStyle="#fff";c.fillRect(0,0,PW,PH);
  const cas=f.T==="CASSETTE",M=40,W=PW-2*M;let y=0;
  c.fillStyle="#0b3d91";c.fillRect(0,0,PW,66);
  c.fillStyle="#fff";c.textBaseline="alphabetic";c.font="bold 19px Arial,sans-serif";c.fillText("Hydraulic Pressure Calculator",M,30);
  c.font="11px Arial,sans-serif";c.fillText(T.pdfT+(f.T?" · "+(cas?T.cas:T.cyl):"")+" · "+(idx+1)+"/"+total,M,50);
  y=88;
  const head=t=>{c.fillStyle="#0b3d91";c.font="bold 11px Arial,sans-serif";c.fillText(t,M,y);c.fillRect(M,y+4,W,1.5);y+=20};
  const kv=(k,v)=>{if(!v)return;c.fillStyle="#5b6b8c";c.font="10.5px Arial,sans-serif";c.fillText(k,M+2,y);c.fillStyle="#14213d";c.textAlign="right";
    const t=fit(c,String(v),W-190,10.5,true);c.fillText(t,M+W-2,y);c.textAlign="left";c.fillStyle="#e3e9f5";c.fillRect(M,y+5,W,.7);y+=18};
  head(T.info.toUpperCase?T.info:T.info);
  kv(T.id,f.ID);kv(T.name,f.RN);if(f.T)kv(T.type,cas?T.cas:T.cyl);kv(T.date,fmt(f.CALC));kv(T.model,f.M);y+=6;
  head(T.press);c.fillStyle="#e8f0ff";c.fillRect(M,y-4,W,50);c.fillStyle="#0b3d91";c.textAlign="center";
  c.font="bold 30px Arial,sans-serif";c.fillText((f.BAR||"")+" BAR",PW/2,y+30);c.textAlign="left";y+=62;
  if(f.MB||f.IN||f.KN){head(T.inp);if(f.MB)kv(T.mb,num(f.MB)+" BAR");if(f.IN)kv(T.ins,num(f.IN)+" kN·Nm");if(f.KN)kv(T.kn,num(f.KN)+" kN·Nm");y+=6}
  if(f.T&&f.S){head(cas?T.casH:T.cylH);kv(cas?T.casT:T.cylT,f.ET);kv(cas?T.af:T.met,f.S);y+=6}
  if(f.TN){head(T.tech);kv(T.by,f.TN+(f.TI?" ("+f.TI+")":""));y+=6}
  // QR block anchored to the bottom of the page
  const q=118,qy=PH-q-70;
  c.fillStyle="#0b3d91";c.font="bold 11px Arial,sans-serif";c.fillText("QR / "+T.id,M,qy-10);c.fillRect(M,qy-6,W,1.5);
  c.fillStyle="#fff";c.fillRect(M,qy,q,q);c.strokeStyle="#d5def0";c.strokeRect(M,qy,q,q);
  try{const qr=qrcode(0,"L");qr.addData(location.href);qr.make();const n=qr.getModuleCount(),cell=(q-8)/(n+8);
    c.fillStyle="#000";for(let r=0;r<n;r++)for(let k=0;k<n;k++)if(qr.isDark(r,k))c.fillRect(M+4+cell*4+k*cell,qy+4+cell*4+r*cell,cell+.25,cell+.25)}catch(e){}
  const tx=M+q+16;c.fillStyle="#5b6b8c";c.font="10px Arial,sans-serif";c.fillText(T.id,tx,qy+14);
  c.fillStyle="#14213d";c.font=fit(c,f.ID,W-q-16,11,true);c.fillText(f.ID,tx,qy+30);
  c.fillStyle="#5b6b8c";c.font="10px Arial,sans-serif";c.fillText(T.share,tx,qy+52);c.fillStyle="#14213d";c.font="bold 11px Arial,sans-serif";c.fillText(SID,tx,qy+68);
  c.fillStyle="#5b6b8c";c.font="10px Arial,sans-serif";c.fillText(T.ck,tx,qy+90);c.fillStyle="#0a7a3b";c.font="bold 11px Arial,sans-serif";c.fillText(f._ck+"  ✔",tx,qy+106);
  // footer note (wrapped)
  c.fillStyle="#5b6b8c";c.font="8.5px Arial,sans-serif";const words=T.note.split(" ");let line="",ny=PH-44;
  for(const w of words){const t=line?line+" "+w:w;if(c.measureText(t).width>W){c.fillText(line,M,ny);ny+=11;line=w}else line=t}c.fillText(line,M,ny);
  return cv}
const enc=new TextEncoder();
function cat(parts){let n=0;parts.forEach(p=>n+=p.length);const o=new Uint8Array(n);let k=0;parts.forEach(p=>{o.set(p,k);k+=p.length});return o}
async function makePdf(f,idx,total){
  const cv=pageCanvas(f,idx,total);
  const jpg=new Uint8Array(await new Promise(r=>cv.toBlob(b=>b.arrayBuffer().then(r),"image/jpeg",.92)));
  const objs=[];const parts=[];let off=0;const offs=[];
  const push=u=>{parts.push(u);off+=u.length};
  push(enc.encode("%PDF-1.4\n"));
  const o=(n,body)=>{offs[n]=off;push(enc.encode(n+" 0 obj\n"));push(typeof body==="string"?enc.encode(body):body);push(enc.encode("\nendobj\n"))};
  o(1,"<< /Type /Catalog /Pages 2 0 R >>");o(2,"<< /Type /Pages /Kids [3 0 R] /Count 1 >>");
  o(3,"<< /Type /Page /Parent 2 0 R /MediaBox [0 0 595.28 841.89] /Resources << /XObject << /Im0 4 0 R >> >> /Contents 5 0 R >>");
  o(4,cat([enc.encode(`<< /Type /XObject /Subtype /Image /Width ${cv.width} /Height ${cv.height} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${jpg.length} >>\nstream\n`),jpg,enc.encode("\nendstream")]));
  const cs="q 595.28 0 0 841.89 0 0 cm /Im0 Do Q";o(5,`<< /Length ${cs.length} >>\nstream\n${cs}\nendstream`);
  const xr=off;let x="xref\n0 6\n0000000000 65535 f \n";for(let i=1;i<=5;i++)x+=String(offs[i]).padStart(10,"0")+" 00000 n \n";
  x+=`trailer\n<< /Size 6 /Root 1 0 R >>\nstartxref\n${xr}\n%%EOF`;push(enc.encode(x));
  return cat(parts)}
function fname(f,i){const t=f.T==="CASSETTE"?"Cassette":f.T==="CYLINDER"?"Cylinder":"Report";
  return (String(i+1).padStart(2,"0")+"_"+t+"_"+(f.S||"")+"_"+(f.BAR||"")+"BAR_"+f.ID.slice(-8)+".pdf").replace(/[^A-Za-z0-9._-]+/g,"-").replace(/-+/g,"-")}
let CT=null;function crc(b){if(!CT){CT=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;CT[n]=c>>>0}}
  let c=~0;for(let i=0;i<b.length;i++)c=CT[(c^b[i])&255]^(c>>>8);return(~c)>>>0}
function zip(files){
  const now=new Date(),dt=((now.getFullYear()-1980)<<9|(now.getMonth()+1)<<5|now.getDate())&0xffff,tm=(now.getHours()<<11|now.getMinutes()<<5|now.getSeconds()>>1)&0xffff;
  const out=[],cen=[];let off=0;
  for(const f of files){const nm=enc.encode(f.name),c=crc(f.data),h=new DataView(new ArrayBuffer(30));
    h.setUint32(0,0x04034b50,true);h.setUint16(4,20,true);h.setUint16(6,0x0800,true);h.setUint16(8,0,true);h.setUint16(10,tm,true);h.setUint16(12,dt,true);
    h.setUint32(14,c,true);h.setUint32(18,f.data.length,true);h.setUint32(22,f.data.length,true);h.setUint16(26,nm.length,true);h.setUint16(28,0,true);
    out.push(new Uint8Array(h.buffer),nm,f.data);
    const g=new DataView(new ArrayBuffer(46));g.setUint32(0,0x02014b50,true);g.setUint16(4,20,true);g.setUint16(6,20,true);g.setUint16(8,0x0800,true);g.setUint16(10,0,true);
    g.setUint16(12,tm,true);g.setUint16(14,dt,true);g.setUint32(16,c,true);g.setUint32(20,f.data.length,true);g.setUint32(24,f.data.length,true);g.setUint16(28,nm.length,true);g.setUint32(42,off,true);
    cen.push(new Uint8Array(g.buffer),nm);off+=30+nm.length+f.data.length}
  const cl=cen.reduce((a,b)=>a+b.length,0),e=new DataView(new ArrayBuffer(22));
  e.setUint32(0,0x06054b50,true);e.setUint16(8,files.length,true);e.setUint16(10,files.length,true);e.setUint32(12,cl,true);e.setUint32(16,off,true);
  return new Blob([...out,...cen,new Uint8Array(e.buffer)],{type:"application/zip"})}
function save(blob,name){const u=URL.createObjectURL(blob),a=document.createElement("a");a.href=u;a.download=name;document.body.appendChild(a);a.click();
  setTimeout(()=>{a.remove();URL.revokeObjectURL(u)},4000)}
async function downloadOne(i,btn){btn.disabled=true;try{const d=await makePdf(ENTRIES[i],i,ENTRIES.length);save(new Blob([d],{type:"application/pdf"}),fname(ENTRIES[i],i))}finally{btn.disabled=false}}
async function downloadAll(){
  const btn=$("allBtn"),bar=$("bar"),bi=$("barI"),pt=$("pt");btn.disabled=true;bar.style.display="block";bi.style.width="0";
  try{const files=[];
    for(let i=0;i<ENTRIES.length;i++){pt.textContent=T.prog+" "+(i+1)+"/"+ENTRIES.length;await new Promise(r=>setTimeout(r,30));
      files.push({name:fname(ENTRIES[i],i),data:await makePdf(ENTRIES[i],i,ENTRIES.length)});bi.style.width=Math.round((i+1)/ENTRIES.length*90)+"%"}
    pt.textContent="ZIP…";await new Promise(r=>setTimeout(r,30));
    save(zip(files),"HPC-"+SID+".zip");bi.style.width="100%";pt.textContent=T.done;
  }catch(e){pt.textContent="Error: "+e}finally{btn.disabled=false}}

load().then(render).catch(e=>fail(e));
</script>
